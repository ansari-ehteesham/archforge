[project]
name = "archforge"
version = "0.1.0"
description = "AI agent that turns AWS architecture designs into CDK infrastructure"
readme = "README.md"
authors = [
    { name = "Ansari Ehteesham Aqeel", email = "an.ehteesham@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
archforge = "archforge:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"